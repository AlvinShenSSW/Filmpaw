[package]
name = "filmpaw"
version = "0.5.4"
description = "Filmpaw — NAS performer index + archive compare"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# ShellExecuteW for opening folders from the shell process (#31). Narrow
# feature set, plus identity-safe sidecar process handles for transfer exit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
