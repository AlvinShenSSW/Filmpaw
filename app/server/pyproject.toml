[project]
name = "filmpaw-server"
version = "0.1.0"
description = "Filmpaw sidecar server — NAS performer index + archive compare"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "zhconv>=1.4.3",
    "pillow>=11.0",
]

[project.scripts]
filmpaw-server = "filmpaw_server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filmpaw_server"]
