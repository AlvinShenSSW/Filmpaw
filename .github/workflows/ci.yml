name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Server tests
        working-directory: app/server
        run: |
          uv sync
          uv run pytest -q

      - name: OpenAPI drift check
        working-directory: app/server
        run: |
          uv run python -c "
          import json
          from filmpaw_server.app import create_app
          open('../ui/openapi.json', 'w', encoding='utf-8').write(json.dumps(create_app().openapi(), ensure_ascii=False, indent=1))
          "
          git diff --exit-code ../ui/openapi.json || (echo '::error::openapi.json is stale — run the export and commit' && exit 1)

      - name: UI checks
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/biome ci src
          ./node_modules/.bin/vitest run

      - name: Build sidecar (PyInstaller)
        working-directory: app/server
        run: uv run python build_sidecar.py

      # The shell now owns opening folders (#31), and its failure edges —
      # dead sidecar, timeout, redirect, malformed reply, "never launch on
      # error" — are only enforceable by these tests. Without this step the
      # matrix silently rots.
      #
      # Must run AFTER the sidecar build: tauri-build resolves the externalBin
      # at build-script time and fails with "resource path
      # binaries\filmpaw-server-*.exe doesn't exist" on a clean checkout. Still
      # ahead of the NSIS bundle, so a broken shell fails fast.
      - name: Shell tests (cargo)
        working-directory: app/src-tauri
        run: cargo test

      # Also compares the frozen sidecar's /api/health version against
      # tauri.conf.json: the UI's version check can only spot a DIFFERENT
      # version number, so this is what actually catches a sidecar that failed
      # to rebuild while the bundle succeeded (#34, and the incident in the
      # ledger that motivated it).
      - name: Sidecar smoke (port handshake + version match)
        working-directory: app/server
        run: |
          uv run python - <<'EOF'
          import glob
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import urllib.request

          exe = glob.glob("../src-tauri/binaries/filmpaw-server-*.exe")[0]
          expected = json.load(open("../src-tauri/tauri.conf.json", encoding="utf-8"))["version"]

          # ignore_cleanup_errors: PyInstaller onefile runs a bootloader that
          # re-execs the real program, so the DB handle belongs to a GRANDCHILD.
          # We kill the tree below, but Windows can still hold the file briefly
          # and a disposable temp dir must never fail an otherwise-green check.
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              env = dict(os.environ)
              # NEVER let a check touch the default DB location — that is how a
              # real library got overwritten by fixtures once.
              env["FILMPAW_DB"] = os.path.join(tmp, "smoke.db")
              p = subprocess.Popen([exe], stdout=subprocess.PIPE, text=True, env=env)
              result = {}

              def read() -> None:
                  result["line"] = p.stdout.readline().strip()

              try:
                  t = threading.Thread(target=read, daemon=True)
                  t.start()
                  t.join(30)
                  line = result.get("line", "")
                  print("sidecar first line:", line or "<none within 30s>")
                  if not line.startswith("FILMPAW_PORT="):
                      sys.exit(1)
                  port = int(line.split("=", 1)[1])

                  # The port is printed BEFORE uvicorn is accepting, so poll to
                  # a deadline instead of firing one request into the race.
                  deadline = time.time() + 30
                  body = None
                  while time.time() < deadline:
                      try:
                          with urllib.request.urlopen(
                              f"http://127.0.0.1:{port}/api/health", timeout=2
                          ) as r:
                              body = json.load(r)
                          break
                      except Exception:
                          time.sleep(0.5)
                  if body is None:
                      print("::error::sidecar never served /api/health within 30s")
                      sys.exit(1)

                  print("health:", body, "expected version:", expected)
                  if body.get("version") != expected:
                      print(
                          f"::error::stale sidecar — health reports {body.get('version')},"
                          f" tauri.conf.json says {expected}"
                      )
                      sys.exit(1)
              finally:
                  # kill() only reaps the bootloader; the grandchild that holds
                  # the DB survives it (same reason the shell uses taskkill /T).
                  subprocess.run(
                      ["taskkill", "/PID", str(p.pid), "/T", "/F"],
                      capture_output=True,
                  )
                  p.wait(timeout=10)
                  time.sleep(1)  # let Windows release the file handle
          EOF

      - name: Tauri build (NSIS)
        working-directory: app
        run: ui/node_modules/.bin/tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: filmpaw-nsis
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
