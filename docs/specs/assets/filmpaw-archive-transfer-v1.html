<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmpaw · 归档传输设计稿 v1</title>
<style>
:root {
  color-scheme: light;
  --orange:#EF9F27; --orange-hover:#E2921D; --orange-deep:#B45E14;
  --orange-text:#7A4A0C; --orange-soft:#FDF3E3; --hover:#F7F5F1;
  --ink:#33322F; --muted:#6B675E; --line:#ECEAE4; --line-strong:#DDD9D1;
  --paper:#FAF9F6; --white:#FFFFFF; --ok:#3B6D11; --ok-bg:#EAF3DE;
  --ok-border:#C4DD9D; --bad:#A32D2D; --bad-bg:#FCEBEB; --bad-border:#F0B8B8;
  --disabled:#B3AFA6; --canvas:#EEECE6; --shadow:rgba(51,50,47,.09);
  --mono:"Cascadia Mono",Consolas,monospace;
  --font:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:13px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.48}
button,a,input,select{outline-offset:3px}
:focus-visible{outline:2px solid var(--orange-deep)}
button{transition:background-color 160ms,border-color 160ms,color 160ms}
a{color:var(--orange-text);text-decoration:none}
svg{display:block;flex-shrink:0}
.icon{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-library{position:absolute;width:0;height:0;overflow:hidden}
.review-bar{min-height:74px;padding:14px 26px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line-strong);background:var(--paper)}
.review-brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.review-logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--orange-text);background:var(--orange-soft);border:1px solid var(--line-strong)}
.review-title{font-size:14px;font-weight:650;letter-spacing:.2px}
.review-caption{font-size:11px;color:var(--muted)}
.scenes{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.scene-btn{border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 10px;white-space:nowrap;font-size:12px;color:var(--muted)}
.scene-btn:hover{background:var(--hover)}
.scene-btn[aria-pressed=true]{background:var(--white);border-color:var(--line-strong);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.scene-number{font-family:var(--mono);font-size:10px;margin-right:6px;color:var(--orange-deep)}
.review-link{font-family:var(--mono);font-size:12px;white-space:nowrap}
.canvas{padding:22px 26px 0;width:100%;margin:auto}
.window{height:calc(100dvh - 135px);min-height:540px;background:var(--white);border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px var(--shadow);display:flex;flex-direction:column}
.titlebar{height:33px;flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;user-select:none}
.titlebar-brand{display:flex;align-items:center;gap:8px}
.titlebar-brand .icon{width:16px;height:16px;color:var(--orange-deep)}
.window-controls{display:flex;align-items:center;gap:21px;color:var(--muted)}
.window-controls svg{width:12px;height:12px}
.preview-size{width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;color:inherit}
.preview-size:hover{background:var(--line)}
.app{display:flex;flex:1;min-height:0}
.rail{width:56px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);padding:14px 7px;display:flex;flex-direction:column;gap:10px;align-items:center}
.rail-btn{display:grid;place-items:center;width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--muted)}
.rail-btn:hover{background:var(--hover)}
.rail-btn.active{background:var(--orange);color:var(--ink)}
.rail-spacer{flex:1}
.sidebar{width:232px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);min-height:0}
.sidebar-heading{padding:23px 18px 15px}
.sidebar-heading h1{font-size:18px;line-height:1.4;margin:0 0 4px;font-weight:650;letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.batch-picker{margin:0 12px;border:1px solid var(--line-strong);background:var(--white);padding:10px;display:flex;align-items:center;gap:8px;border-radius:9px;text-align:left;min-width:0}
.batch-picker>.icon{color:var(--orange-deep)}
.batch-picker .batch-name{min-width:0;flex:1}
.batch-name strong{display:block;font-size:12px;font-weight:600;white-space:nowrap}
.batch-name span{display:block;font:10px/1.7 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batch-picker .chevron{width:14px}
.sidebar-search{display:flex;align-items:center;gap:7px;margin:14px 12px 8px;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:0 10px;min-height:34px;color:var(--muted)}
.sidebar-search .icon{width:15px;height:15px}
.sidebar-search input{width:100%;min-width:0;font-size:12px;border:0;outline:none;background:transparent}
.sidebar-search:focus-within{outline:2px solid var(--orange-deep);outline-offset:1px}
.section-label{padding:10px 20px 7px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.4px}
.actor-list{min-height:0;overflow:auto;padding:0 8px;flex:1}
.actor-item{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:8px;padding:12px 11px;margin:3px 0;background:transparent;text-align:left}
.actor-item:hover{background:var(--hover)}
.actor-item.active{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-text)}
.actor-item>.icon{width:18px;height:18px;color:var(--orange-deep)}
.actor-item .actor-label{flex:1;min-width:0}
.actor-label strong{font-size:13px;font-weight:600;display:block}
.actor-label small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.count-badge{font:11px var(--mono);color:var(--muted);background:var(--white);padding:3px 6px;border-radius:5px;border:1px solid var(--line)}
.sidebar-bottom{margin:12px 18px 16px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.sidebar-bottom .icon{width:14px;height:14px;color:var(--ok)}
.workspace{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column;position:relative;background:var(--white)}
.workspace-top{padding:16px 24px 0;flex-shrink:0}
.breadcrumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:15px;min-height:25px}
.breadcrumbs .icon{width:14px;height:14px}
.back-button{display:inline-flex;align-items:center;gap:6px;border:0;padding:3px 0;background:transparent;color:var(--muted);font-size:12px}
.back-button:hover{color:var(--orange-deep)}
.breadcrumbs .current{color:var(--ink);font-weight:600}
.target-label{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ok);font-size:11px}
.target-label .icon{width:14px;height:14px}
.actor-header{display:flex;align-items:center;gap:21px;padding:0 0 20px}
.portrait{width:110px;height:156px;border-radius:10px;overflow:hidden;background:var(--orange-soft);flex-shrink:0;border:1px solid var(--line)}
.portrait svg{width:100%;height:100%}
.actor-info{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.actor-info h2{font-size:26px;font-weight:650;line-height:1.3;letter-spacing:1px;margin:0;display:flex;align-items:center;gap:13px}
.name-alias{font-size:12px;letter-spacing:0;font-weight:400;color:var(--muted)}
.actor-meta{display:flex;align-items:center;gap:8px;margin:10px 0 13px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line-strong);border-radius:5px;padding:2px 7px;color:var(--muted);background:var(--paper);white-space:nowrap}
.tag.online{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.tag.online .icon{width:11px;height:11px}
.path-line{display:flex;align-items:center;gap:6px;color:var(--muted);font:12px/1.6 var(--mono);min-width:0}
.path-line .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path-line>.icon{width:16px;height:16px}
.icon-btn{display:grid;place-items:center;border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn .icon{width:16px;height:16px}
.header-actions{align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--white);padding:8px 13px;border-radius:8px;white-space:nowrap;font-size:12px;font-weight:600;min-height:36px}
.button:hover:not(:disabled){background:var(--hover);border-color:var(--disabled)}
.button .icon{width:17px;height:17px}
.button.primary{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.button.primary:hover:not(:disabled){background:var(--orange-hover);border-color:var(--orange-hover)}
.button.text{background:transparent;border-color:transparent;font-weight:400;color:var(--muted)}
.button.danger{color:var(--bad);border-color:var(--bad-border)}
.button.small-button{padding:5px 10px;min-height:30px;font-size:11px}
.header-actions>.button.text{padding:0;min-height:24px;font-size:11px}
.transfer-area{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px 0}
.transfer-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:16px 0 13px;flex-shrink:0}
.transfer-heading h3{font-size:14px;margin:0;font-weight:650}
.direction{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.direction .icon{width:15px;height:15px;color:var(--orange-deep)}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;min-height:0;flex:1}
.pane{min-width:0;min-height:0;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pane-head{padding:13px 15px 11px;flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line)}
.pane-title-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pane-title-row .icon{width:17px;height:17px;color:var(--orange-deep)}
.pane-title-row h4{font-size:13px;font-weight:650;margin:0}
.pane-title-row .pane-count{font:11px var(--mono);color:var(--muted)}
.pane-title-row .icon-btn{margin-left:auto;width:25px;height:25px}
.pane-head .path-line{font-size:10px;min-height:18px}
.table-tools{display:flex;align-items:center;gap:9px;min-height:39px;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0;font-size:11px;color:var(--muted)}
.check-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
input[type=checkbox]{accent-color:var(--orange);width:15px;height:15px;margin:0;cursor:pointer;flex-shrink:0}
input[type=checkbox]:disabled{cursor:not-allowed}
.sort-button{display:inline-flex;align-items:center;gap:4px;margin-left:auto;border:0;background:transparent;padding:5px 1px;color:var(--muted);font-size:11px;white-space:nowrap}
.sort-button:hover{color:var(--orange-deep)}
.sort-button .icon{width:13px;height:13px}
.file-list{overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.file-row{padding:12px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);min-height:62px;position:relative}
.file-row:last-child{border-bottom:0}
label.file-row{cursor:pointer}
label.file-row:hover{background:var(--hover)}
.file-row.selected{background:var(--orange-soft)}
.file-row.selected:hover{background:var(--orange-soft)}
.file-row.conflict{background:var(--bad-bg)}
.file-row.finished{background:var(--ok-bg)}
.file-row>.icon{width:20px;height:20px;color:var(--orange-deep)}
.file-body{flex:1;min-width:0}
.file-name{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.file-sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-sub .quality{font:9px/1.6 var(--mono);border:1px solid var(--line-strong);border-radius:3px;padding:0 3px;background:var(--white)}
.file-size{font:11px var(--mono);white-space:nowrap;color:var(--muted);align-self:center}
.file-state{font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:3px;color:var(--muted)}
.file-state .icon{width:12px;height:12px}
.file-state.bad{color:var(--bad)}
.file-state.ok{color:var(--ok)}
.file-state.active{color:var(--orange-text)}
.pane-footer{display:flex;align-items:center;gap:5px;background:var(--paper);padding:7px 13px;min-height:31px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);flex-shrink:0}
.pane-footer .icon{width:13px;height:13px}
.notice{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--bad-border);background:var(--bad-bg);border-radius:8px;margin-bottom:12px;flex-shrink:0;color:var(--bad)}
.notice>.icon{width:18px;height:18px;margin-top:2px}
.notice-content{flex:1;min-width:0}
.notice strong{font-weight:600;font-size:12px}
.notice p{margin:2px 0 0;font-size:11px;line-height:1.6}
.notice .button{background:var(--white);border-color:var(--bad-border);color:var(--bad);align-self:center;flex-shrink:0}
.notice.success{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.notice.warning{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-text)}
.actionbar{margin-top:14px;padding:15px 24px 17px;border-top:1px solid var(--line);display:flex;align-items:center;gap:15px;flex-shrink:0;background:var(--paper)}
.action-summary{flex:1;min-width:0}
.action-summary strong{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.action-summary strong .icon{width:19px;height:19px}
.action-summary small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.action-summary .amount{font:12px var(--mono);color:var(--muted)}
.actionbar .primary{min-height:43px;padding-left:18px;padding-right:18px;font-size:13px}
.actionbar .button.text{padding:7px 0;font-size:11px}
.progress-block{flex:1;min-width:0}
.progress-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.progress-title>.icon{width:17px;height:17px;color:var(--orange-deep)}
.progress-title .percent{margin-left:auto;font:12px var(--mono);font-weight:600}
progress{appearance:none;width:100%;height:5px;border:0;border-radius:4px;overflow:hidden;display:block;background:var(--line);margin:8px 0 6px}
progress::-webkit-progress-bar{background:var(--line);border-radius:4px}
progress::-webkit-progress-value{background:var(--orange);border-radius:4px}
progress::-moz-progress-bar{background:var(--orange);border-radius:4px}
.progress-details{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted)}
.progress-details span:last-child{font-family:var(--mono);white-space:nowrap}
.steps{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--muted);margin-top:8px}
.steps .active{color:var(--orange-text);font-weight:650}
.steps .completed{color:var(--ok)}
.steps .step{display:flex;gap:4px;align-items:center}
.steps .icon{width:12px;height:12px}
.choice-content{padding:0 24px 24px;overflow:auto;flex:1}
.choice-intro{padding:0 0 20px}
.choice-intro h2{font-size:23px;letter-spacing:.4px;margin:6px 0}
.choice-intro p{margin:0;color:var(--muted);font-size:12px}
.match-search{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;margin:20px 0 10px;background:var(--white)}
.match-search input{border:0;background:transparent;outline:none;min-width:0;flex:1}
.match-search:focus-within{outline:2px solid var(--orange-deep);outline-offset:2px}
.match-search .icon{color:var(--muted);width:17px;height:17px}
.match-count{font-size:11px;color:var(--muted);margin-bottom:15px}
.candidates{display:flex;flex-direction:column;gap:12px}
.candidate{display:flex;align-items:center;gap:20px;border:1px solid var(--line-strong);border-radius:11px;padding:16px;background:var(--white)}
.candidate .portrait{width:156px;height:222px}
.candidate h3{font-size:20px;margin:0 0 5px;font-weight:650}
.candidate-info{min-width:0;flex:1}
.candidate-info .tag{margin-bottom:10px;display:inline-flex}
.candidate-note{font-size:11px;color:var(--muted);margin-top:12px}
.candidate-actions{display:flex;align-items:flex-end;flex-direction:column;gap:9px}
.candidate-actions .primary{font-size:12px;min-height:38px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:26px 12px;flex:1;min-height:140px}
.empty>.icon{width:31px;height:31px;color:var(--disabled);margin-bottom:10px}
.empty strong{font-size:12px;color:var(--ink);font-weight:600}
.empty p{font-size:11px;line-height:1.8;margin:5px 0 12px}
.review-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;color:var(--muted);font-size:11px}
.review-foot strong{color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;bottom:55px;transform:translate(-50%,12px);background:var(--ink);color:var(--white);padding:11px 18px;border-radius:9px;box-shadow:0 5px 20px var(--shadow);font-size:12px;max-width:calc(100vw - 40px);opacity:0;pointer-events:none;z-index:30;transition:opacity 180ms,transform 180ms;text-align:center}
.toast.visible{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid var(--line-strong);border-radius:13px;padding:24px;background:var(--white);color:var(--ink);width:min(480px,calc(100vw - 32px));box-shadow:0 20px 80px var(--shadow)}
dialog::backdrop{background:rgba(51,50,47,.35)}
dialog h2{font-size:18px;margin:0 0 10px}
dialog p{font-size:12px;color:var(--muted);line-height:1.9;margin:0 0 16px}
dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.batch-option{width:100%;text-align:left;display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;padding:12px;margin:8px 0}
.batch-option .icon{color:var(--orange-deep)}
.batch-option:hover{background:var(--orange-soft);border-color:var(--orange)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body.isolated{background:var(--white)}
.isolated .review-bar,.isolated .review-foot{display:none}
.isolated .canvas{padding:0;max-width:none}

    <label class="sidebar-search">${icon('search')}<input type="search" id="actor-filter" aria-label="筛选本地演员" placeholder="筛选本地演员" value="${escapeHtml(state.actorFilter)}"></label>

function pathLine(path,kind='folder',copy=false) {

function header() {
  return `<div class="workspace-top detail-top">${breadcrumb()}<section class="actor-header" aria-label="已选演员和归档目标">${portrait()}<div class="actor-info"><div class="actor-summary"><h2>${actor().name}<span class="name-alias">${actor().alias}</span></h2><div class="actor-meta"><span class="tag">${state.target} · ${state.target==='EAGLE'?'第二片库':'主片库'}</span><span class="tag ${state.phase==='offline'?'':'online'}">${icon(state.phase==='offline'?'cloud-off':'circle-check')}${state.phase==='offline'?'暂不可访问':'可访问'}</span><span class="small muted">${state.phase==='offline'?'影片数待读取':`${state.nas.length} 部已归档`}</span></div></div>${pathLine(nasPath(),'server',true)}</div><div class="header-actions">${button('双开文件夹','open-pair','','archive',state.phase==='offline')}${button('更换归档目标','back','text','',busy())}</div></section></div>`;
}
function notice() {
  if(state.phase==='conflict')return `<div class="notice" role="alert">${icon('warning')}<div class="notice-content"><strong>发现 ${conflicts().length} 个同名冲突，本批尚未开始</strong><p>${conflicts().map(m=>`MKO-${m.id}`).join('、')} 在 NAS 已存在。处理冲突或取消选中后，再发起传输。</p></div>${button('取消选中冲突项','deselect-conflicts','small-button')}</div>`;
  if(state.phase==='done')return `<div class="notice success" role="status">${icon('circle-check')}<div class="notice-content"><strong>${state.done.length} 部影片已归档，${gb(state.total)}</strong><p>NAS 内容校验通过，本地对应影片文件夹已移除。</p></div></div>`;
  if(state.phase==='partial')return `<div class="notice warning" role="alert">${icon('warning')}<div class="notice-content"><strong>MKO-118 已复制完整，但本地文件仍被占用</strong><p>本地清理未完成，后续队列已停止。请双开核对并处理本地残留。</p></div>${button('重新核对','recheck','small-button')}</div>`;
  if(state.phase==='offline')return `<div class="notice" role="alert">${icon('cloud-off')}<div class="notice-content"><strong>${state.target} 暂不可访问，传输不可用</strong><p>本地影片未变动。检查 NAS 连接后，刷新右侧列表。</p></div></div>`;
  if(state.stopped)return `<div class="notice warning" role="status">${icon('stop')}<div class="notice-content"><strong>队列已停止 · ${state.done.length} 部已完成</strong><p>未完成影片保留在本地。重新选择后可以发起新一批传输。</p></div></div>`;
  return '';
}
function movieRow(m,side) {
  const source=side==='source',selected=source&&state.selected.has(m.id),duplicate=source&&state.nas.some(n=>collator.compare(n.name,m.name)===0)&&state.cleanup!==m.id;
  const blocking=state.phase==='conflict'&&(source?selected&&duplicate:conflicts().some(c=>collator.compare(c.name,m.name)===0));
  const current=busy()&&state.queue[state.cursor]?.id===m.id;
  let status='',statusClass='',statusIcon='';
  if(m.id===state.cleanup) {status=source?'源未清理':'副本已完整保存';statusClass='active';statusIcon='info';}
  else if(blocking) {status='同名冲突';statusClass='bad';statusIcon='warning';}
  else if(duplicate) {status='NAS 已有同名';statusIcon='info';}
  else if(current){status=state.stage==='copy'?'正在复制':state.stage==='verify'?'正在校验':'清理源目录';statusClass='active';statusIcon='clock';}
  else if(!source&&m.added){status='刚刚归档';statusClass='ok';statusIcon='check';}
  else if(source&&busy()&&selected){status='等待中';statusIcon='clock';}
  const classes=`file-row ${selected?'selected':''} ${blocking?'conflict':''} ${!source&&m.added?'finished':''}`;
  const tag=source?'label':'div';
  return `<${tag} class="${classes}" data-movie-id="${m.id}" title="${escapeHtml(m.name)}">${source?`<input type="checkbox" id="movie-${m.id}" data-movie="${m.id}" aria-label="选择 ${escapeHtml(m.name)}" ${selected?'checked':''} ${busy()||state.phase==='offline'||m.id===state.cleanup?'disabled':''}>`:''}${icon('folder')}<span class="file-body"><span class="file-name">${escapeHtml(m.name)}</span><span class="file-sub"><span class="quality">${m.quality}</span>${m.files} 个文件 · 视频 / NFO / 图片</span>${status?`<span class="file-state ${statusClass}">${icon(statusIcon)}${status}</span>`:''}</span><span class="file-size">${gb(m.size)}</span></${tag}>`;
}
function pane(side) {
  const source=side==='source',items=source?state.local:state.nas;
  const order=source?state.sourceSort:state.nasSort;
  const sorted=[...items].sort((a,b)=>order*collator.compare(a.name,b.name));
  const eligible=state.local.filter(m=>m.id!==state.cleanup);
  const all=eligible.length>0&&eligible.every(m=>state.selected.has(m.id));
  return `<section class="pane" aria-label="${source?'本地影片':'NAS 片库'}"><header class="pane-head"><div class="pane-title-row">${icon(source?'monitor':'server')}<h4>${source?'本地 · 待整理':'NAS · 已归档'}</h4><span class="pane-count">${!source&&state.phase==='offline'?'—':items.length}</span>${iconButton(source?'刷新本地影片':'刷新 NAS 影片','refresh', 'refresh',busy(),`data-side="${side}"`)}</div>${pathLine(source?localPath():nasPath())}</header><div class="table-tools">${source?`<label class="check-label"><input type="checkbox" id="select-all" aria-label="全选本地影片" ${all?'checked':''} ${busy()||state.phase==='offline'||!eligible.length?'disabled':''}>全选</label><span>名称</span>`:'<span>影片文件夹</span>'}<button class="sort-button" id="sort-${side}" data-action="sort" data-side="${side}" aria-label="${source?'本地':'NAS'}名称${order===1?'升序':'降序'}，点击切换">名称${order===1?'正序':'倒序'}${icon(order===1?'up':'desc')}</button></div>
    <div class="file-list" id="list-${side}" tabindex="0" aria-label="${source?'本地':'NAS'}影片列表">${!source&&state.phase==='offline'?`<div class="empty">${icon('cloud-off')}<strong>无法读取 NAS 目录</strong><p>这不是一个空目录。<br>连接恢复后可重新读取。</p>${button('重新连接','reconnect','','refresh')}</div>`:sorted.map(m=>movieRow(m,side)).join('')||`<div class="empty">${icon(source?'circle-check':'folder')}<strong>${source?'这个演员的影片已整理完':'还没有影片文件夹'}</strong><p>${source?'演员目录与根部图片仍保留。':'传输完成的影片会出现在这里。'}</p></div>`}</div>
    <footer class="pane-footer">${icon(source?'info':'lock')}${source?'移动整部影片文件夹及全部内容':'对照列表 · 仅接收本地传入'}</footer></section>`;
}
function actionbar() {
  if(busy()) {
    const current=state.queue[state.cursor];
    const phaseText=state.stage==='copy'?'正在复制':state.stage==='verify'?'正在校验':'正在清理本地';
    const doneSize=sum(state.queue.filter(m=>state.done.includes(m.id)));
    const copied=doneSize+(current?current.size*(state.stage==='copy'?state.progress/100:1):0);
    return `<footer class="actionbar"><div class="progress-block"><div class="progress-title">${icon('archive')}<span>${phaseText} · MKO-${current?.id||''}</span><span class="percent">${Math.round(state.progress)}%</span></div><progress max="100" value="${state.progress}" aria-label="${phaseText}进度">${state.progress}%</progress><div class="progress-details"><span>第 ${state.cursor+1} / ${state.queue.length} 部 · 已完成 ${state.done.length} 部</span><span>${gb(copied)} / ${gb(state.total)}${state.stage==='copy'?' · 112 MB/s':''}</span></div><div class="steps"><span class="step ${state.stage==='copy'?'active':'completed'}">${icon(state.stage==='copy'?'clock':'check')}复制</span>${icon('chevron')}<span class="step ${state.stage==='verify'?'active':state.stage==='cleanup'?'completed':''}">校验内容</span>${icon('chevron')}<span class="step ${state.stage==='cleanup'?'active':''}">清理本地</span></div></div>${button('停止传输','stop','','stop')}</footer>`;
  }
  if(state.phase==='done')return `<footer class="actionbar"><div class="action-summary"><strong style="color:var(--ok)">${icon('circle-check')}本批传输完成</strong><small>${state.local.length} 部影片仍在本地，可继续选择；同名项需另行处理。</small></div>${button('继续整理','continue','primary','right')}</footer>`;
  if(state.phase==='partial')return `<footer class="actionbar"><div class="action-summary"><strong>${icon('warning')}1 部已完成 · 1 部待清理 · 1 部未开始</strong><small>已复制到 NAS 的影片不会自动重复传输。</small></div>${button('双开处理','open-pair','primary','archive')}</footer>`;
  const picked=selectedMovies(), conflict=state.phase==='conflict';
  return `<footer class="actionbar"><div class="action-summary"><strong>${picked.length?`已选 ${picked.length} 部影片 <span class="amount">/ ${gb(sum(picked))}</span>`:'勾选左侧影片，开始归档'}</strong><small>${state.phase==='offline'?'请先恢复 NAS 连接，再选择影片。':conflict?'本批未移动任何影片，请先处理同名冲突。':`传入 ${state.target} / ${actor().name} · 校验成功后移除本地原件`}</small></div>${picked.length?button('取消选择','clear','text'):''}${button(conflict?'重新检查':`传输到 NAS${picked.length?`（${picked.length}）`:''}`,'transfer','primary','right',!picked.length||state.phase==='offline')}</footer>`;
}
function detailView() {
  return `<main class="workspace" aria-label="影片归档详情">${header()}<section class="transfer-area"><div class="transfer-heading"><h3>影片文件夹</h3><div class="direction">本地 batch ${icon('right')} NAS 片库</div></div>${notice()}<div class="panes">${pane('source')}${pane('nas')}</div></section>${actionbar()}</main>`;
}
function render() {
  const focused=document.activeElement?.id, cursor=document.activeElement?.selectionStart;
  const scrolls=['list-source','list-nas'].map(id=>[id,document.getElementById(id)?.scrollTop||0]);
  renderScenes();$('#app').innerHTML=rail()+sidebar()+(state.view==='choose'?choicesView():detailView());
  const all=$('#select-all');
  if(all) {const eligible=state.local.filter(m=>m.id!==state.cleanup);const count=eligible.filter(m=>state.selected.has(m.id)).length;all.indeterminate=count>0&&count<eligible.length;}
  scrolls.forEach(([id,top])=>{const el=document.getElementById(id);if(el)el.scrollTop=top;});
  if(focused){const el=document.getElementById(focused);if(el){el.focus({preventScroll:true});if(typeof cursor==='number'&&['text','search'].includes(el.type))el.setSelectionRange(cursor,cursor);}}
}
function revealMovie(id) {
  for(const side of ['source','nas']) {
    const list=$(`#list-${side}`),row=list?.querySelector(`[data-movie-id="${id}"]`);
    if(row){const r=row.getBoundingClientRect(),l=list.getBoundingClientRect();list.scrollTop+=r.top-l.top-(list.clientHeight-row.clientHeight)/2;}
  }
}
function revealConflict() {const first=conflicts()[0];if(first)revealMovie(first.id);}
function openDialog(title,html,actions='') {
  $('#dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${html}<div class="dialog-actions">${actions||button('知道了','close-dialog','primary')}</div>`;
  if(!$('#dialog').open)$('#dialog').showModal();
}
function pairPreview(target=state.target) {
  const dest=`\\\\${target}\\Video Station\\演员库\\${actor().name}`;
  openDialog('双开文件夹',`<p>将同时打开这两个演员目录。设计稿仅预览路径。</p><div class="small muted">本地目录</div><p style="font-family:var(--mono);overflow-wrap:anywhere;color:var(--ink)">${escapeHtml(localPath())}</p><div class="small muted">NAS 目录</div><p style="font-family:var(--mono);overflow-wrap:anywhere;color:var(--ink)">${escapeHtml(dest)}</p>`);
}
function beginTransfer() {
  if(busy()||!state.selected.size||state.phase==='offline')return;
  if(conflicts().length){state.phase='conflict';state.scene='conflict';state.stopped=false;render();revealConflict();announce('发现同名冲突，本次队列未开始。');return;}
  state.queue=selectedMovies().map(m=>({...m}));state.cursor=0;state.done=[];state.total=sum(state.queue);
  state.phase='progress';state.scene='progress';state.stage='copy';state.progress=0;state.stopped=false;render();announce(`已开始模拟传输 ${state.queue.length} 部影片。`);
  clearInterval(timer);timer=setInterval(tick,450);
}
function tick() {
  if(!busy()) {clearInterval(timer);return;}
  if(state.stage==='copy') {state.progress=Math.min(100,state.progress+17);if(state.progress===100){state.stage='verify';state.progress=0;}}
  else if(state.stage==='verify') {state.progress=Math.min(100,state.progress+34);if(state.progress===100){state.stage='cleanup';state.progress=100;}}
  else {
    completeItem(state.queue[state.cursor]);state.cursor++;
    if(state.cursor>=state.queue.length){clearInterval(timer);timer=null;state.phase='done';state.scene='done';announce(`模拟传输完成，${state.done.length} 部影片已归档。`);}
    else {state.stage='copy';state.progress=0;}
  }
  render();
}
document.addEventListener('click',async event=>{
  const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;
  const action=el.dataset.action;
  if(action==='scene'){actorIndex=0;reset(el.dataset.scene);return;}
  if(action==='nav'){toast('本稿聚焦归档传输，其他页面沿用当前应用。');return;}
  if(action==='archive'){if(!busy())reset('ready');return;}
  if(action==='actor'){actorIndex=Number(el.dataset.actor);reset('choose');announce(`已选择本地演员 ${actor().name}，请选定 NAS 目标。`);return;}
  if(action==='back'){if(!busy()){state.view='choose';state.phase='choose';state.scene='choose';state.selected.clear();render();$('#match-search')?.focus();}return;}
  if(action==='target'){state.target=el.dataset.target;state.nas=state.libraries[state.target];state.view='detail';state.phase='ready';state.scene='ready';state.selected.clear();state.done=[];state.cleanup=null;state.stopped=false;render();$('#select-all')?.focus();return;}
  if(action==='open-pair'){pairPreview(el.dataset.target||state.target);return;}
  if(action==='path'){openDialog('完整目录路径',`<p style="font-family:var(--mono);color:var(--ink);overflow-wrap:anywhere;user-select:all" id="full-path">${escapeHtml(el.dataset.path)}</p>`,button('关闭','close-dialog')+button('复制路径','copy-path','primary','copy'));return;}
  if(action==='copy-path'){try{await navigator.clipboard.writeText($('#full-path').textContent);toast('路径已复制');}catch{const range=document.createRange();range.selectNodeContents($('#full-path'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);toast('路径已选中，请按 Ctrl+C 复制');}return;}
  if(action==='close-dialog'){$('#dialog').close();return;}
  if(action==='batch'){openDialog('选择一个 batch',`<p>设计稿提供两组示例目录，选择后会重新确认演员和归档目标。</p>${batchPaths.map((path,i)=>`<button class="batch-option" data-action="pick-batch" data-index="${i}">${icon('folder')}<span>${escapeHtml(path)}</span></button>`).join('')}`,button('取消','close-dialog'));return;}
  if(action==='pick-batch'){lastBatch=Number(el.dataset.index);$('#dialog').close();reset('choose');return;}
  if(action==='sort'){if(el.dataset.side==='source')state.sourceSort*=-1;else state.nasSort*=-1;render();return;}
  if(action==='clear'){state.selected.clear();if(state.phase==='conflict'){state.phase='ready';state.scene='ready';}render();return;}
  if(action==='deselect-conflicts'){conflicts().forEach(m=>state.selected.delete(m.id));state.phase='ready';state.scene='ready';render();announce('已取消选中冲突影片，其余选择保留。');return;}
  if(action==='transfer'){beginTransfer();return;}
  if(action==='stop'){openDialog('停止这次传输？','<p>后续影片将不再传输。当前影片在安全阶段停止，未完成影片保留在本地；已经完成的影片保留在 NAS。</p>',button('继续传输','close-dialog')+button('停止传输','confirm-stop','danger','stop'));return;}
  if(action==='confirm-stop'){
    $('#dialog').close();clearInterval(timer);timer=null;
    if(!busy()){toast('本批已经完成，无需停止。');return;}
    if(busy()&&state.stage==='cleanup')completeItem(state.queue[state.cursor]);
    state.phase='ready';state.scene='ready';state.selected.clear();state.stopped=true;render();announce('队列已停止，未完成影片保留在本地。');return;
  }
  if(action==='continue'){state.phase='ready';state.scene='ready';state.selected.clear();state.stopped=false;render();return;}
  if(action==='recheck'){toast('模拟核对：NAS 副本完整，本地文件仍被占用。请双开处理后再次核对。');return;}
  if(action==='refresh'){if(state.phase==='offline'&&el.dataset.side==='nas'){toast('NAS 仍不可访问，可点击「重新连接」查看恢复状态。');}else{toast(`${el.dataset.side==='source'?'本地':'NAS'}影片列表已刷新`);}return;}
  if(action==='reconnect'){state.phase='ready';state.scene='ready';state.selected.clear();render();toast('连接已恢复，请重新选择要传输的影片。');return;}
});
document.addEventListener('change',event=>{
  if(busy())return;
  if(event.target.matches('[data-movie]')){const id=Number(event.target.dataset.movie);event.target.checked?state.selected.add(id):state.selected.delete(id);}
  else if(event.target.id==='select-all'){state.selected=event.target.checked?new Set(state.local.filter(m=>m.id!==state.cleanup).map(m=>m.id)):new Set();}
  else return;
  if(['done','conflict'].includes(state.phase)){state.phase='ready';state.scene='ready';}
  state.stopped=false;render();
});
document.addEventListener('input',event=>{
  if(event.target.id==='actor-filter'){state.actorFilter=event.target.value;render();}
  if(event.target.id==='match-search'){state.query=event.target.value;render();}
});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const b=$('#dialog').getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)$('#dialog').close();}});
const params=new URLSearchParams(location.search);
if(params.get('window')==='1')document.body.classList.add('isolated');
function updatePreviewSize() {
  const expanded=document.body.classList.contains('isolated');
  const control=$('#preview-size');
  control.setAttribute('aria-pressed',String(expanded));
  control.setAttribute('aria-label',expanded?'还原预览':'最大化预览');
  control.title=expanded?'还原预览':'最大化预览：目录随窗口扩展';
  $('use',control).setAttribute('href',expanded?'#i-copy':'#i-expand');
}
$('#preview-size').addEventListener('click',()=>{
  document.body.classList.toggle('isolated');
  updatePreviewSize();
});
updatePreviewSize();
const initial=scenes.some(([id])=>id===params.get('scene'))?params.get('scene'):'ready';
reset(initial);
window.filmpawReview={setScene:reset,getState:()=>({phase:state.phase,selected:[...state.selected],local:state.local.map(m=>m.id),nas:state.nas.map(m=>m.id),target:state.target,done:[...state.done]})};
</script>
</body>
</html>
